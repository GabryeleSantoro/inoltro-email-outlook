[project]
name = "inoltro-email-outlook"
version = "2.0.0"
description = "Servizio HTTP che analizza le email di telemedicina inviate da Power Automate: screening, OCR degli allegati e punteggio di sentiment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "pywinauto>=0.6.8",
]

[project.optional-dependencies]
win = ["pywinauto>=0.6.8"]
dev = ["pytest>=8.0", "responses>=0.25", "httpx>=0.27"]

[project.scripts]
inoltro-email = "inoltro_email.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
