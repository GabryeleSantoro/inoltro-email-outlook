# Configurazione del servizio di analisi email (telemedicina)
# Copiare in `config.yaml` e adattare. Il file e' facoltativo: senza di esso
# valgono i valori qui indicati come predefiniti.
# I segreti NON vanno qui: la chiave di ocr.space e quella condivisa con Power
# Automate stanno nel file .env (OCR_SPACE_API_KEY, SERVICE_API_KEY).

api:
  # 0.0.0.0 = accetta connessioni da qualsiasi interfaccia (necessario in un
  # container). Le variabili d'ambiente API_HOST e PORT hanno la precedenza.
  host: "0.0.0.0"
  port: 8000
  # Corpo massimo della richiesta: gli allegati arrivano in base64, quindi
  # occupano circa 4/3 della loro dimensione reale.
  max_request_bytes: 33554432
  title: "Servizio telemedicina - analisi email"

# Prima verifica, su oggetto e corpo del messaggio. Se non la supera, l'email
# non viene nemmeno passata all'OCR.
screening:
  keywords:
    - "telemedicina"
    - "televisita"
  # any = basta uno dei termini (telemedicina OPPURE televisita)
  # all = servono tutti
  mode: "any"
  # false (predefinito) = gli allegati si leggono comunque, anche se oggetto e
  # corpo non parlano di telemedicina: il contenuto di un'impegnativa puo'
  # ribaltare un oggetto che non dice nulla, e il verdetto si vuole con tutti i
  # dati alla mano. true = niente OCR se lo screening non passa (risparmia
  # quota, ma perde i messaggi con l'oggetto generico).
  stop_on_failure: false

# Criteri che deve soddisfare il testo letto dagli allegati e dalle foto.
rules:
  keywords:
    - "telemedicina"
  # Codici: confronto tollerante a spazi e separatori (15 0 1A, 15-01A, ...).
  codes:
    - "1501A"
  # all = servono TUTTE le keyword E TUTTI i codici (AND)
  # any = ne basta uno qualsiasi (OR)
  mode: "all"
  # Corregge le confusioni tipiche dell'OCR sui codici (O/0, I/1, L/1, S/5, B/8).
  # Non viene mai applicato alle keyword.
  fuzzy_ocr_confusions: true

ocr:
  endpoint: "https://api.ocr.space/parse/image"
  # 'ita' e' supportato solo dagli engine 1 e 3. L'engine 2 ignora questo campo
  # (rileva la lingua da solo) ed e' in genere il piu' accurato sui documenti.
  language: "ita"
  engine: 2
  timeout_seconds: 120
  max_retries: 3
  # Limiti del piano gratuito ocr.space: 1 MB per file, 3 pagine per PDF.
  # Con un piano PRO si possono alzare (es. 5242880 e 999).
  max_file_bytes: 1048576
  max_pdf_pages_per_request: 3
  # false (predefinito) = un PDF che si riesce a leggere direttamente non passa
  # dall'OCR: il suo livello di testo e' esatto e non costa nulla. All'OCR ci si
  # va solo se la lettura fallisce o non produce testo utile (PDF scansionato).
  # true = anche i PDF leggibili passano dall'OCR e i due testi vengono uniti:
  # recupera cio' che nel PDF e' solo immagine, al prezzo di una chiamata per
  # ogni documento.
  always_call: false
  # true = un'immagine oltre max_file_bytes viene ridimensionata e inviata
  # comunque, invece di essere saltata. Una foto di impegnativa scattata col
  # telefono supera sempre il MB del piano gratuito.
  resize_oversized_images: true

attachments:
  # Il servizio legge solo PDF e immagini. Questo elenco puo' restringere i
  # formati, non allargarli: un'estensione non supportata viene ignorata e
  # segnalata nei log. Le GIF sono escluse perche' ocr.space le rifiuta (e in
  # una email aziendale sono quasi sempre il logo animato della firma).
  allowed_extensions: [".pdf", ".jpg", ".jpeg", ".png", ".tif", ".tiff", ".bmp"]
  # File piu' grandi di questo vengono ignorati (byte).
  max_bytes: 10485760
  # Analizza anche le foto incorporate nel corpo (allegati inline e immagini
  # "data:" dentro l'HTML): spesso l'impegnativa e' fotografata nel messaggio.
  include_inline_images: true
  # Quanti file al massimo passare all'OCR per ogni email.
  max_files: 10
  # true (predefinito) = si leggono tutti i file allegati, anche dopo averne
  # trovato uno conforme: il verdetto tiene conto di tutto quello che e'
  # arrivato. false = ci si ferma al primo conforme (meno chiamate all'OCR).
  analyze_all: true
  # Restituisce nella risposta il testo letto da ogni documento. E' un dato
  # sanitario: chi non lo vuole in giro lo mette a false.
  return_text: true
  # Quanto testo restituire per documento (0 = tutto). Serve solo a non far
  # esplodere la risposta con un referto di venti pagine.
  max_text_chars: 20000

# Allegati che il flusso non manda in base64 ma indica con il percorso su disco
# (campo "attchment" del payload). Quei percorsi sono la base per l'OCR: il file
# viene letto da dove si trova, senza ricopiarlo.
local_files:
  enabled: true
  # Se valorizzato, si accettano SOLO percorsi dentro queste cartelle. Da
  # riempire quando il servizio e' raggiungibile da altre macchine: evita che un
  # payload possa far leggere un file qualsiasi del disco.
  # allowed_directories:
  #   - "C:/Users/user/Documents/Power Automate/Allegati"
  # Dove cercare il file per nome se il percorso indicato non esiste (serve se
  # il servizio gira su una macchina diversa da quella del flusso).
  # search_directories:
  #   - "/srv/allegati"
  allowed_directories: []
  search_directories: []

# Percentuali di sicurezza restituite nella risposta.
confidence:
  # Sopra questa percentuale il messaggio e' considerato di telemedicina
  # ("telemedicina.confermato" nella risposta).
  telemedicine_threshold: 50
  # Sopra questa percentuale e' considerato una prenotazione di telemedicina.
  # Insieme alla precedente determina "prenotazione_telemedicina".
  booking_threshold: 60
  # Sotto questa percentuale, calcolata prima dell'OCR su oggetto, corpo e nomi
  # dei file, non si spende una chiamata all'OCR. Zero (predefinito) = si legge
  # sempre tutto. Alzandola si risparmia quota su newsletter e fogli di accessi,
  # al prezzo di non vedere il contenuto dei loro allegati.
  min_percent_for_ocr: 0
  # Sopra questa percentuale la prenotazione e' considerata *certa*: e' cio' che
  # fa rispondere 200 invece di 202. Deve stare sopra booking_threshold.
  # Alzandola si risponde 200 solo ai casi lampanti, abbassandola si accettano
  # piu' messaggi senza revisione umana.
  certainty_threshold: 80
  # Taratura fine: sono i termini costanti dei due punteggi, in log-odds. Piu'
  # sono negativi, piu' indizi servono per arrivare a una percentuale alta.
  telemedicine_bias: -2.2
  booking_bias: -3.2

sentiment:
  # Sopra questo punteggio l'etichetta e' "positivo", sotto negative_threshold
  # e' "negativo", in mezzo "neutro". Il punteggio va da -1 a +1.
  positive_threshold: 0.15
  negative_threshold: -0.15
  # Da 0 a 1: sopra questa soglia il messaggio e' considerato una richiesta di
  # prenotazione di telemedicina.
  booking_threshold: 0.5
  # Quanto un allegato conforme rafforza l'ipotesi "prenotazione".
  attachment_bonus: 0.15

logging:
  level: "INFO"
  # Modello del nome: con per_session attivo ogni avvio scrive il proprio file,
  # con data e ora di inizio nel nome (logs/servizio-20250521-091500.log).
  file: "logs/servizio.log"
  # false = si torna a un unico file cumulativo (quello indicato sopra).
  per_session: true
  # Quanti log di sessione conservare: i piu' vecchi vengono cancellati.
  # 0 = non cancellare nulla.
  keep_sessions: 30

# Click automatico sul popup di conferma di Power Automate Desktop.
# Quando un flow viene avviato da .lnk, PAD mostra una finestra che chiede
# "Continue" prima di eseguire. Questa sezione gestisce il click automatico
# con blocco temporaneo dell'input utente (pywinauto, solo Windows).
flow_popup:
  # true = cerca e clicca "Continue" dopo l'avvio del flusso.
  # false = ignora il popup (utile per debug o se PAD non lo mostra).
  auto_continue: true
  # Testo (o regex) del titolo della finestra di conferma.
  popup_title: "Power Automate"
  # Testo del pulsante da cliccare.
  popup_button: "Continua"
  # Secondi massimi di attesa per la comparsa del popup.
  popup_timeout: 10
