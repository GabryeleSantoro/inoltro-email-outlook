# Configurazione di inoltro-email-outlook
# Copiare in `config.yaml` e adattare. I segreti NON vanno qui: la chiave di
# ocr.space e le credenziali dell'applicazione Microsoft stanno nel file .env
# (OCR_SPACE_API_KEY, MS_CLIENT_ID, MS_CLIENT_SECRET, MS_TENANT_ID).

ocr:
  endpoint: "https://api.ocr.space/parse/image"
  # 'ita' e' supportato solo dagli engine 1 e 3. L'engine 2 ignora questo campo
  # (rileva la lingua da solo) ed e' in genere il piu' accurato sui documenti.
  language: "ita"
  engine: 2
  timeout_seconds: 120
  max_retries: 3
  # Limiti del piano gratuito ocr.space: 1 MB per file, 3 pagine per PDF.
  # Con un piano PRO si possono alzare (es. 5242880 e 999).
  max_file_bytes: 1048576
  max_pdf_pages_per_request: 3

rules:
  # Parole da cercare nel testo estratto dall'allegato.
  keywords:
    - "televisita"
  # Codici: confronto tollerante a spazi e separatori (15 A 10, 15-A10, ...).
  codes:
    - "1501A"
  # all = servono TUTTE le keyword E TUTTI i codici (AND)
  # any = ne basta uno qualsiasi (OR)
  mode: "all"
  # Corregge le confusioni tipiche dell'OCR sui codici (O/0, I/1, L/1, S/5, B/8).
  # Non viene mai applicato alle keyword.
  fuzzy_ocr_confusions: true

forward:
  to:
    - "destinatario@example.com"
  cc: []
  subject_prefix: "[TELEVISITA 1501A] "
  body_note: "Inoltro automatico: l'allegato soddisfa i criteri configurati."
  # true = simula soltanto, non invia nulla. Metterlo a false per inoltrare davvero.
  dry_run: true

outlook:
  # Cartella da sorvegliare. "Inbox" = Posta in arrivo.
  # Per una sottocartella usare il percorso: "Inbox/Televisite"
  folder: "Inbox"
  # Ogni quanto interrogare la casella (minuti).
  poll_interval_minutes: 5
  # Quanto indietro guardare a ogni controllo (minuti): tenerlo >= all'intervallo.
  lookback_minutes: 5
  # true = si esaminano solo i messaggi ancora da leggere.
  unread_only: true
  # Al primo controllo dopo l'avvio guarda indietro di N minuti (recupera cio'
  # che e' arrivato mentre il programma era spento). 0 per disattivare.
  catch_up_minutes: 30
  # Quanti messaggi al massimo scaricare per ogni controllo.
  max_messages_per_poll: 50
  # Categoria Outlook applicata ai messaggi inoltrati (vuoto per disattivare).
  processed_category: "Inoltrata-Televisita"
  # Come ci si autentica sull'applicazione registrata su Microsoft Entra ID:
  #   authorization -> a nome dell'utente, con segreto client (consigliato)
  #   public        -> a nome dell'utente, applicazione senza segreto
  #   credentials   -> solo applicazione, senza utente (richiede 'mailbox')
  auth_flow: "authorization"
  # Casella da leggere: obbligatoria con auth_flow "credentials", altrimenti si
  # usa quella dell'utente che ha dato il consenso.
  mailbox: ""
  # Dove viene conservato il token (contiene il refresh token: non versionarlo).
  token_path: "state/o365_token.txt"
  request_timeout_seconds: 60

attachments:
  allowed_extensions:
    [".pdf", ".jpg", ".jpeg", ".png", ".tif", ".tiff", ".bmp", ".gif"]
  # Allegati piu' grandi di questo vengono ignorati (byte).
  max_bytes: 10485760

storage:
  db_path: "state/processed.sqlite3"

logging:
  level: "INFO"
  # Modello del nome: con per_session attivo ogni avvio scrive il proprio file,
  # con data e ora di inizio nel nome (logs/inoltro-20250521-091500.log).
  file: "logs/inoltro.log"
  # false = si torna a un unico file cumulativo (quello indicato sopra).
  per_session: true
  # Quanti log di sessione conservare: i piu' vecchi vengono cancellati.
  # 0 = non cancellare nulla.
  keep_sessions: 30
