# Template configurazione servizio analisi email.
# Copiare in config.yaml e adattare. Parametri omessi usano i default del servizio.
# Segreti solo in .env: SERVICE_API_KEY.

api:
  host: "0.0.0.0"
  port: 8000
  max_request_bytes: 33554432

# Termini cercati in oggetto e corpo prima dell'analisi degli allegati.
screening:
  keywords: ["telemedicina", "televisita"]
  mode: "any"

# Criteri richiesti in ricetta/impegnativa.
rules:
  keywords: ["telemedicina"]
  codes: ["1501A"]
  mode: "all"
  fuzzy_ocr_confusions: true

ocr:
  # Cache persistente dei modelli PaddleOCR.
  model_cache_dir: "C:/ProgramData/inoltro-email/models"

attachments:
  # Foto incorporate nel corpo: spesso contengono la ricetta.
  include_inline_images: true
  # Il testo OCR e' un dato sanitario: impostare false se non serve nella risposta.
  return_text: true
  max_text_chars: 20000

# Usato quando Power Automate passa un percorso locale nel campo "attchment".
local_files:
  enabled: true
  # In produzione indicare solo cartelle dedicate agli allegati.
  allowed_directories: []
  search_directories: []

confidence:
  # Soglia per considerare certa la prenotazione.
  certainty_threshold: 80
  # Alzare per evitare OCR su messaggi poco pertinenti; 0 = sempre.
  min_percent_for_ocr: 0

logging:
  level: "INFO"
  file: "logs/servizio.log"
  per_session: true
  keep_sessions: 30
